<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shard — мессенджер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;650;750;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <div class="aurora"><i></i><i></i><i></i></div>

  <div class="app-shell">

    <!-- ================= LEFT RAIL ================= -->
    <nav class="rail glass" id="rail" aria-label="Основная навигация"></nav>

    <!-- ================= CHAT LIST COLUMN ================= -->
    <aside class="list-col glass" id="list-col">

      <!-- top panel: search + profile -->
      <div class="topbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="search-input" id="search-input" type="text" placeholder="Поиск: люди, чаты, каналы, группы" autocomplete="off" spellcheck="false">
          <button class="search-clear" id="search-clear" aria-label="Очистить">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <div class="search-results glass hidden" id="search-results" role="listbox"></div>
        </div>
        <button class="profile-btn" id="profile-btn" aria-label="Открыть профиль" title="Мой профиль"></button>
      </div>

      <!-- list header with collapse -->
      <div class="list-header">
        <div class="title-row">
          <span class="overline" id="section-title">Чаты</span>
        </div>
        <button class="collapse-btn" id="collapse-btn" aria-label="Свернуть список чатов" title="Свернуть">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/><path d="M20 4v16"/></svg>
        </button>
      </div>

      <!-- chats -->
      <div class="chat-list" id="chat-list"></div>
    </aside>

    <!-- ================= CHAT AREA (self chat) ================= -->
    <main class="chat-area glass">
      <header class="chat-header">
        <div class="avatar round" id="header-avatar" style="position:relative"></div>
        <div class="who">
          <div class="name" id="self-name">Вы</div>
          <div class="status">Избранное · заметки самому себе</div>
        </div>
        <div class="actions">
          <button class="icon-btn" id="theme-toggle" aria-label="Сменить тему" title="Тема"></button>
          <button class="icon-btn" title="Звонок (скоро)">
            <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.9Z"/></svg>
          </button>
          <button class="icon-btn" title="Ещё">
            <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages" aria-live="polite"></div>

      <footer class="composer">
        <textarea id="composer-input" rows="1" placeholder="Написать самому себе…"></textarea>
        <button class="send-btn" id="send-btn" aria-label="Отправить">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
        </button>
      </footer>
    </main>
  </div>

  <!-- expand FAB when list collapsed -->
  <button class="expand-fab" id="expand-fab" aria-label="Развернуть список чатов">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/><path d="M4 4v16"/></svg>
  </button>

  <!-- ================= PROFILE DRAWER ================= -->
  <div class="drawer-scrim" id="drawer-scrim"></div>
  <aside class="drawer glass" id="profile-drawer" aria-hidden="true" aria-label="Профиль">
    <div class="drawer-head">
      <button class="icon-btn drawer-close" id="drawer-close" aria-label="Закрыть профиль">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="drawer-id">
        <div class="avatar lg" id="drawer-avatar"></div>
        <div>
          <div class="dname" id="drawer-name"></div>
          <div class="duser" id="drawer-user"></div>
        </div>
      </div>
    </div>

    <div class="drawer-body">
      <div class="field">
        <input type="text" id="pf-display" placeholder=" " maxlength="40">
        <label for="pf-display">Отображаемое имя</label>
        <span class="hint" data-default=""></span>
      </div>

      <div class="field">
        <input type="text" id="pf-username" placeholder=" " disabled readonly style="opacity:.7">
        <label for="pf-username">Юзернейм</label>
        <span class="hint" data-default="Юзернейм изменить нельзя"></span>
      </div>

      <div class="field">
        <textarea id="pf-bio" placeholder=" " maxlength="160"></textarea>
        <label for="pf-bio">О себе</label>
        <span class="hint" data-default=""></span>
      </div>
      <div class="bio-count" id="bio-count">0 / 160</div>

      <div class="drawer-actions">
        <button class="btn btn-filled" id="pf-save">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          Сохранить
        </button>
        <button class="btn btn-outlined" id="pf-logout">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
          Выйти
        </button>
      </div>
    </div>
  </aside>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
